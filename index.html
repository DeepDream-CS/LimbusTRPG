<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbus Company TRPG · 车卡器</title>
<link rel="stylesheet" href="建卡器.css?v=24">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Limbus Company TRPG · 建卡器</h1>
      <div class="sub">Character Creation</div>
      <a class="btn ghost btn-goto" href="战斗器.html" title="导入角色卡，跑一场战斗">⚔ 战斗计算器</a>
      <a class="btn ghost btn-goto" href="鉴定器.html" title="打开鉴定器，可直接读取当前角色">🎲 鉴定器</a>
      <button class="btn ghost btn-reset" id="btnReset" title="清空当前角色卡的全部内容，从第一步重新开始">↺ 新建角色卡</button>
    </div>
    <nav class="steps" id="stepChips"></nav>
  </header>

  <main class="stage">
    <div class="card" id="stageCard"></div>
    <div class="nav">
      <button class="btn ghost" id="btnBack">← 返回上一步</button>
      <button class="btn primary" id="btnNext">下一步 →</button>
    </div>
  </main>

  <aside class="summary">
    <div class="card">
      <h3>当前角色卡</h3>
      <div id="sideSummary"></div>
    </div>
  </aside>
</div>

<canvas id="exportCanvas" width="760" height="3600"></canvas>
<div class="toast" id="toast"></div>

<script src="建卡器.js?v=24"></script>
</body>
</html>
