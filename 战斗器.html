<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbus Company TRPG 2.0 · 群聊场控与自动战斗器</title>
<link rel="stylesheet" href="建卡器.css?v=3">
</head>
<body>
<div class="app app-wide">
  <header class="top">
    <div class="brand">
      <h1>Limbus Company TRPG · 群聊场控与战斗器</h1>
      <span class="sub">v2.0 Director</span>
      <div class="brand-nav">
        <a class="btn ghost" href="index.html">← 建卡与成长器</a>
        <a class="btn ghost" href="敌人制作器.html">👹 30秒配怪器</a>
        <a class="btn ghost" href="题库.html">📖 规则与词条速查</a>
        <a class="btn ghost" href="v1/战斗器.html">📦 1.0旧版</a>
      </div>
    </div>
    <div class="round-bar">
      <span class="round-no">第 <b id="roundNo">1</b> 回合</span>
      <span class="round-tally" id="roundHint"></span>
      <button class="btn primary" id="btnCopyBoard">📋 复制群聊回合面板</button>
      <button class="btn" id="btnCopyLog">📋 复制本轮战报</button>
      <button class="btn" id="btnNextRound">下一回合 →</button>
      <button class="btn ghost danger-hover" id="btnResetAll">↺ 重置战场</button>
    </div>
  </header>

  <main class="stage">
    <!-- 公共罪孽池 -->
    <div class="sin-pool-bar" id="sinPoolBar"></div>

    <!-- 双方单位面板 -->
    <section class="board-grid">
      <div class="card">
        <div class="sec-head" style="margin-bottom:10px">
          <h2 style="margin:0;font-size:17px">我方罪人</h2>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn ghost mini" id="btnImport">⇩ 导入角色/遭遇 JSON</button>
            <button class="btn ghost mini" id="btnDemoParty">⚡ 载入示例三人队</button>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".json,application/json" multiple hidden>
        <div class="unit-list" id="playerList"></div>
      </div>

      <div class="card">
        <div class="sec-head" style="margin-bottom:10px">
          <h2 style="margin:0;font-size:17px">敌方 / 异想体部位</h2>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <select id="presetEncSel" style="width:auto;padding:3px 8px;font-size:12px">
              <option value="rats">预设：ZAYIN 后巷清道夫</option>
              <option value="redshoes" selected>预设：TETH 异想体《红舞鞋》</option>
              <option value="shooter">预设：HE 异想体《魔弹射手》</option>
            </select>
            <button class="btn ghost mini" id="btnLoadPreset">👹 载入遭遇</button>
            <button class="btn ghost mini" id="btnQuickMob">＋ 杂兵</button>
          </div>
        </div>
        <div class="unit-list" id="enemyList"></div>
      </div>
    </section>

    <!-- 同步排线与一键结算台 -->
    <div class="card" style="margin-bottom:18px" id="wireCard">
      <div class="sec-head">
        <div>
          <h2>同步排线与交锋工作台</h2>
          <p class="lead" style="margin-bottom:6px">全队自由调整出手顺位（1号位先手削弱/破防，后手收割）。既可手填跑团群里骰娘投出的 <code>1D6</code> 点数，也可留空由系统自动代投。</p>
        </div>
      </div>
      <div id="resBanner"></div>
      <div class="wire-rows" id="wireRows"></div>
      <div class="export-row" id="wireActions"></div>
    </div>

    <!-- 群聊面板实时文本抽屉与战斗日志 -->
    <div class="grid2">
      <div class="card">
        <div class="sec-head" style="margin-bottom:8px">
          <h2 style="font-size:17px;margin:0">群聊回合置顶面板（实时生成）</h2>
          <button class="btn mini" id="btnCopyBoard2">📋 一键复制</button>
        </div>
        <textarea class="code-box" id="boardTextPreview" style="min-height:220px" readonly></textarea>
      </div>

      <div class="card">
        <div class="sec-head" style="margin-bottom:8px">
          <h2 style="font-size:17px;margin:0">战斗战报记录</h2>
          <button class="btn ghost mini" id="btnClearLog">清空记录</button>
        </div>
        <div id="logBox"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="建卡器.js?v=3"></script>
<script src="战斗器.js?v=3"></script>
</body>
</html>
