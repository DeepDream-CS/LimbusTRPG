<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbus Company TRPG 2.0 · 30秒异想体与遭遇配怪器</title>
<link rel="stylesheet" href="建卡器.css?v=3">
</head>
<body>
<div class="app app-wide">
  <header class="top">
    <div class="brand">
      <h1>Limbus Company TRPG · 30秒配怪器</h1>
      <span class="sub">v2.0 Foe Maker</span>
      <div class="brand-nav">
        <a class="btn ghost" href="index.html">← 建卡与成长器</a>
        <a class="btn ghost" href="战斗器.html">⚔ 群聊场控 & 战斗器</a>
        <a class="btn ghost" href="题库.html">📖 规则与词条速查</a>
        <button class="btn" id="btnCopyEncounter">📋 复制群聊图鉴</button>
        <button class="btn primary" id="btnExport">⬇ 导出遭遇 JSON</button>
        <button class="btn ghost" id="btnImport">⇩ 导入</button>
        <button class="btn ghost danger-hover" id="btnClear">↺ 清空</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </header>

  <main class="stage">
    <div class="card" style="margin-bottom:16px">
      <h2>一键数值尺与预设模板</h2>
      <p class="lead">选定本场遭遇的<b>危险等级</b>与我方<b>参战总行动槽数 S</b>（初期 3 人队 S=3；HE 阶双槽 3 人队 S=6），点一下按钮即可按标准平衡公式自动生成敌人或双部位异想体。</p>
      <div class="pool" id="scaleBar"></div>
      <div class="export-row" id="presetBar" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)"></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="grid2">
        <label class="field" style="margin:0">
          <span class="lab">遭遇名称</span>
          <input type="text" id="encTitle" placeholder="例如：TETH 异想体《红舞鞋》镇压战">
        </label>
        <label class="field" style="margin:0">
          <span class="lab">通关战利品 / 备注（选填）</span>
          <input type="text" id="encReward" placeholder="例如：每人 3 纺锤 + 提取 TETH E.G.O【红舞鞋】">
        </label>
      </div>
    </div>

    <div id="foeList"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="建卡器.js?v=3"></script>
<script src="敌人制作器.js?v=3"></script>
</body>
</html>
